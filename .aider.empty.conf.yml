# =========================================================
# AEGIS HARNESS — EXECUTOR CONFIGURATION
# =========================================================

model: openai/meta/llama-3.1-8b-instruct

# =========================================================
# EXECUTION
# =========================================================

yes-always: true

stream: false

pretty: false

multiline: false

fancy-input: false

# =========================================================
# REPOSITORY
# =========================================================

git: false

auto-commits: false

dirty-commits: false

subtree-only: false

# =========================================================
# HISTORY / PERSISTENCE
# =========================================================

restore-chat-history: false

input-history-file: /dev/null

chat-history-file: /dev/null

llm-history-file: /dev/null

# =========================================================
# PERFORMANCE
# =========================================================

map-tokens: 0

map-refresh: manual

show-model-warnings: false

check-update: false

watch-files: false

cache-prompts: false

# =========================================================
# UI / NOISE REDUCTION
# =========================================================

suggest-shell-commands: false

detect-urls: false

notifications: false

show-diffs: false

# =========================================================
# FORMATTING
# =========================================================

encoding: utf-8

line-endings: lf

# =========================================================
# EXECUTOR TOPOLOGY
# =========================================================

# IMPORTANT:
#
# Aider operates as a mutation-oriented
# cognition executor inside disposable
# isolated worktrees.
#
# The runtime governs:
# - persistence
# - continuity
# - promotion
# - authority
#
# Sandbox contents are ephemeral.
#
# Containment is enforced mechanically
# through:
# - disposable worktrees
# - runtime promotion rules
# - isolated filesystem boundaries
#
# The runtime remains sovereign.