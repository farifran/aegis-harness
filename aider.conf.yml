# =========================================================
# AEGIS HARNESS — AIDER CONFIG
# =========================================================
#
# Executor operational configuration only.
#
# This file does NOT define:
# - governance;
# - runtime authority;
# - orchestration logic;
# - bounded cognition;
# - continuity governance.
#
# Those belong to:
# - AGENTS.md
# - runtime_aegis.sh
# - .skills/
# - orchestration layer
#
# =========================================================

# ---------------------------------------------------------
# MODEL
# ---------------------------------------------------------

model: openrouter/deepseek/deepseek-r1:free

# ---------------------------------------------------------
# EXECUTION AUTOMATION
# ---------------------------------------------------------

yes-always: true

# ---------------------------------------------------------
# GIT
# ---------------------------------------------------------

git: true

auto-commits: false
dirty-commits: false

# ---------------------------------------------------------
# STRUCTURAL PERCEPTION
# ---------------------------------------------------------

map-tokens: 2048
map-refresh: auto

# ---------------------------------------------------------
# CONTEXT WINDOW
# ---------------------------------------------------------

max-chat-history-tokens: 16000

# ---------------------------------------------------------
# VALIDATION
# ---------------------------------------------------------

auto-test: true

test-cmd: npm run aegis:full

lint-retries: 3

# ---------------------------------------------------------
# DIFF CONTROL
# ---------------------------------------------------------

show-diffs: true

# ---------------------------------------------------------
# EXECUTOR SAFETY
# ---------------------------------------------------------

check-update: false

suggest-shell-commands: false

# ---------------------------------------------------------
# FINAL PRINCIPLE
# ---------------------------------------------------------

# The executor assists repository mutation.
#
# It does not own:
# - governance;
# - cognition;
# - orchestration;
# - structural truth.
#
# Context governance remains externalized.