# ---------------------------------------------------------
# MODEL
# ---------------------------------------------------------

model: openai/qwen/qwen3-next-80b-a3b-instruct

# ---------------------------------------------------------
# EXECUTION
# ---------------------------------------------------------

yes-always: true

dry-run: true

auto-commits: false

# ---------------------------------------------------------
# EXECUTOR CONTAINMENT
# ---------------------------------------------------------

git: false

restore-chat-history: false

map-tokens: 0

map-refresh: manual

# ---------------------------------------------------------
# OUTPUT STABILITY
# ---------------------------------------------------------

stream: false

pretty: false

show-model-warnings: false

# ---------------------------------------------------------
# INTERACTION MINIMIZATION
# ---------------------------------------------------------

suggest-shell-commands: false

detect-urls: false

notifications: false

fancy-input: false

multiline: false

# ---------------------------------------------------------
# EDIT BEHAVIOR
# ---------------------------------------------------------

edit-format: whole

# ---------------------------------------------------------
# ENCODING
# ---------------------------------------------------------

encoding: utf-8

line-endings: lf