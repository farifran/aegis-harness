# ---------------------------------------------------------

# Runtime sequencing must remain externalized.
#
# Modes must not:
# - recursively invoke earlier epistemological layers;
# - redefine orchestration flow;
# - create implicit cognitive loops.
#
# Escalation signaling is allowed.
