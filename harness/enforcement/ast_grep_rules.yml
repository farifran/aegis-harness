# =========================================================
# AEGIS HARNESS — AST-GREP ENFORCEMENT RULES
# =========================================================

# This file provides mechanically enforceable structural constraints.
#
# It is NOT:
# - constitutional governance;
# - runtime orchestration;
# - mode cognition;
# - architectural truth.
#
# The goal is not stylistic purity.
#
# The goal is:
# - preserving structural observability;
# - constraining redesign drift;
# - reducing hidden execution expansion;
# - maintaining bounded operational complexity;
# - preserving epistemic reliability.

rules:

  # -------------------------------------------------------
  # EMPTY FAILURE ABSORPTION
  # -------------------------------------------------------

  - id: no-empty-catch
    language: TypeScript
    severity: error
    message: "Empty catch blocks hide operational failure surfaces."
    rule:
      pattern: |
        try {
          $$$TRY
        } catch ($ERR) {
        }

  # -------------------------------------------------------
  # HIDDEN ASYNC PROPAGATION
  # -------------------------------------------------------

  - id: no-floating-promise-then
    language: TypeScript
    severity: warning
    message: "Unhandled async propagation reduces execution observability."
    rule:
      pattern: |
        $PROMISE.then($$$ARGS)

  - id: no-async-foreach
    language: TypeScript
    severity: warning
    message: "Async logic inside forEach frequently obscures execution ordering."
    rule:
      pattern: |
        $ARRAY.forEach(async ($ITEM) => {
          $$$BODY
        })

  # -------------------------------------------------------
  # STRUCTURAL COMPLEXITY EXPANSION
  # -------------------------------------------------------

  - id: excessive-nested-if-depth
    language: TypeScript
    severity: warning
    message: "Excessive nesting increases operational opacity and structural complexity."
    rule:
      pattern: |
        if ($A) {
          if ($B) {
            if ($C) {
              if ($D) {
                $$$BODY
              }
            }
          }
        }

  # -------------------------------------------------------
  # DYNAMIC EXECUTION OPACITY
  # -------------------------------------------------------

  - id: no-eval
    language: TypeScript
    severity: error
    message: "Dynamic evaluation bypasses bounded structural reasoning."
    rule:
      pattern: |
        eval($CODE)

  # -------------------------------------------------------
  # PREMATURE ABSTRACTION DRIFT
  # -------------------------------------------------------

  - id: speculative-generic-abstraction
    language: TypeScript
    severity: warning
    message: "Speculative generic abstraction may increase redesign drift."
    rule:
      regex: 'create[A-Z].*Factory|Base[A-Z].*Service|Abstract[A-Z]'

  - id: single-implementation-interface
    language: TypeScript
    severity: warning
    message: "Single-consumer abstraction may indicate unnecessary indirection."
    rule:
      regex: 'interface\s+[A-Z]'

  # -------------------------------------------------------
  # CROSS-LAYER EXPANSION SIGNALS
  # -------------------------------------------------------

  - id: deep-relative-cross-layer-import
    language: TypeScript
    severity: warning
    message: "Deep relative imports may indicate hidden architectural expansion."
    rule:
      regex: 'from\s+[\"\'](\.\./){3,}'

  # -------------------------------------------------------
  # EXECUTION OPACITY
  # -------------------------------------------------------

  - id: excessive-wrapper-indirection
    language: TypeScript
    severity: warning
    message: "Excessive indirection reduces execution observability."
    rule:
      regex: 'wrap|wrapper|adapter|facade'

  # -------------------------------------------------------
  # SPECULATIVE OPTIMIZATION PRESSURE
  # -------------------------------------------------------

  - id: speculative-extensibility
    language: TypeScript
    severity: warning
    message: "Optimization for hypothetical future complexity may increase redesign drift."
    rule:
      regex: 'future|extensible|generic|pluggable|scalable'

  # -------------------------------------------------------
  # ORCHESTRATION LEAKAGE
  # -------------------------------------------------------

  - id: recursive-mode-invocation
    language: TypeScript
    severity: error
    message: "Modes must not recursively orchestrate epistemological layers."
    rule:
      regex: 'Mode\s*[0-5]|mode_[0-5]'

  # -------------------------------------------------------
  # ARCHITECTURAL CERTAINTY LEAKAGE
  # -------------------------------------------------------

  - id: unsupported-certainty-language
    language: TypeScript
    severity: warning
    message: "Unsupported certainty language may encourage epistemic overconfidence."
    rule:
      regex: 'guaranteed|certainly correct|fully verified|perfectly safe'
